[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldboard"
version = "0.1.0"
description = "Terminal dashboard for running local repo quality tools"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Billy Box", email = "billybox1926@users.noreply.github.com"}]

[project.scripts]
fieldboard = "fieldboard:main"

[tool.setuptools]
py-modules = ["fieldboard"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
