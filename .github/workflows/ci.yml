name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
      - name: Lint with ruff
        run: |
          ruff check fieldboard.py tests/test_fieldboard.py
          ruff format --check fieldboard.py tests/test_fieldboard.py
      - name: Test with pytest
        run: |
          pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.5.0" "mypy==1.10.0"
      - name: Run ruff check
        run: |
          ruff check fieldboard.py tests/test_fieldboard.py
      - name: Run ruff format check
        run: |
          ruff format --check fieldboard.py tests/test_fieldboard.py
      - name: Run mypy
        run: |
          mypy fieldboard.py --ignore-missing-imports
